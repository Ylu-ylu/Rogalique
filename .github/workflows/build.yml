name: Build Game Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # Добавляем установку инструментов C++ (важно для Game.sln)
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Добавляем установку NuGet для управления зависимостями
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: List all repository files recursively
        run: Get-ChildItem -Recurse

      # Используем NuGet для восстановления, так как msbuild /t:Restore 
      # может конфликтовать с C++ проектами в облаке
      - name: Restore NuGet packages
        run: nuget restore Game.sln

      - name: Build solution
        # Добавлен флаг /m для многопоточной сборки (ускоряет процесс)
        run: msbuild Game.sln /p:Configuration=Release /p:Platform=x64 /m