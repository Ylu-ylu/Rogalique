name: Build Game Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: List files for debug
        run: dir/s /b
        shell: cmd

      - name: List Release files
        run: if exist x64\Release dir /s /b x64\Release || echo "No Release files"
        shell: cmd

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore Game.sln

      - name: Build solution
        run: |
          set CL=/std:c++17 /I"%CD%\SFML\SFML-2.5.1\include" /I"%CD%\Engine"
          msbuild Game.sln /p:Configuration=Release /m
        shell: cmd

      - name: List Release files
        run: if exist x64\Release dir /s /b x64\Release || echo "No Release files"
        shell: cmd