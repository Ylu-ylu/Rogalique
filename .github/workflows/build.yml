name: Build Game Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # Шаг 1: Настройка MSVC (решает проблему с iostream и путями)
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore Rogalique/Game.sln

      - name: Build solution
        # Если Release|x64 не работает, попробуйте просто Release
        run: msbuild Rogalique/Game.sln /p:Configuration=Release /m