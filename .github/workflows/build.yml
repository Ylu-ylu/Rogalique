name: Build Game Solution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: List all repository files recursively
        run: Get-ChildItem -Recurse

      - name: Restore NuGet packages
        # Исправлено: добавлен путь к папке Rogalique
        run: nuget restore Rogalique/Game.sln

      - name: Build solution
        # Исправлено: добавлен путь к папке Rogalique
        run: msbuild Rogalique/Game.sln /p:Configuration=Release /p:Platform=x64 /m